<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afstand en oppervlakte – oefenen en eindtoets (2 havo/vwo)</title>
<style>
:root{
  --paper:#F6FAFE; --grid:#DCE8F4; --surface:#FFFFFF; --ink:#14213A; --muted:#55657D;
  --pen:#1D4ED8; --pen-soft:#E8EFFF; --line:#C5D3E4;
  --ok:#0F6B43; --ok-bg:#E4F4EB; --bad:#B42318; --bad-bg:#FDECEA; --warn-bg:#FFF4D6; --warn:#7A5300;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0E1625; --grid:#1B2A41; --surface:#16213A; --ink:#E7EEF9; --muted:#9FB0C9;
    --pen:#8FB5FF; --pen-soft:#1E2E52; --line:#2D3F5F;
    --ok:#6FDCA6; --ok-bg:#123325; --bad:#FF9A90; --bad-bg:#3C1816; --warn-bg:#3A2D0B; --warn:#F3D27A;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:1.0625rem; line-height:1.5;
}
main{max-width:46rem; margin:0 auto; padding:1.5rem 1rem 3rem}
h1,h2,h3{line-height:1.2; margin:0}
h1{font-size:2rem; letter-spacing:-.02em}
h2{font-size:1.35rem; letter-spacing:-.01em}
.sheet{background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:1.25rem 1.25rem 1.5rem; margin-top:1rem}
.lede{color:var(--muted); margin:.4rem 0 0}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--pen); outline-offset:2px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* menu */
.group-title{margin:1.75rem 0 .5rem; font-size:1.1rem}
.rows{list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--line); border-radius:6px}
.rows li+li{border-top:1px solid var(--line)}
.row{display:flex; width:100%; align-items:center; justify-content:space-between; gap:1rem; text-align:left; background:none; border:0; padding:.9rem 1.1rem; min-height:3.5rem}
.row:hover{background:var(--pen-soft)}
.row b{display:block}
.row small{color:var(--muted); font-size:.92rem}
.row .go{color:var(--pen); font-weight:600; white-space:nowrap}
.exam-row .row b{color:var(--pen)}
.note{color:var(--muted); font-size:.9rem; margin-top:2rem}

/* quiz header */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap}
.link{background:none; border:0; color:var(--pen); padding:.4rem 0; text-decoration:underline; text-underline-offset:3px; font-weight:600}
.badge{display:inline-block; font-size:.85rem; font-weight:600; border:1px solid var(--pen); color:var(--pen); border-radius:4px; padding:.1rem .5rem}
.progress{height:6px; background:var(--line); border-radius:3px; margin:.6rem 0 0; overflow:hidden}
.progress>span{display:block; height:100%; background:var(--pen)}
@media (prefers-reduced-motion:no-preference){.progress>span{transition:width .25s}}
.meta{margin:1rem 0 0; color:var(--muted)}
.meta b{color:var(--ink)}

/* question */
.qcard{background:var(--surface); border:1px solid var(--line); border-left:6px solid var(--pen); border-radius:6px; padding:1.1rem 1.25rem; margin-top:.6rem; display:flex; gap:1rem; align-items:center; min-height:6.5rem; overflow-x:auto}
.qnum{font-weight:700; color:var(--pen); font-size:1.15rem; min-width:2.2rem}

.opts{display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-top:1rem}
@media (max-width:34rem){.opts{grid-template-columns:1fr}}
.opt{display:flex; align-items:center; gap:.8rem; text-align:left; background:var(--surface); border:2px solid var(--line); border-radius:6px; padding:.6rem .9rem; min-height:4rem; overflow-x:auto}
.opt:hover:not(:disabled){border-color:var(--pen)}
.opt .l{flex:none; width:1.9rem; height:1.9rem; border-radius:50%; border:1.5px solid var(--muted); display:grid; place-items:center; font-weight:700; font-size:.95rem}
.opt math{font-size:1.2rem; math-style:normal}
.opt.sel{border-color:var(--pen); background:var(--pen-soft)}
.opt.sel .l{background:var(--pen); border-color:var(--pen); color:var(--surface)}
.opt.good{border-color:var(--ok); background:var(--ok-bg)}
.opt.good .l{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg)}
.opt.wrong .l{background:var(--bad); border-color:var(--bad); color:var(--surface)}
.opt .tag{margin-left:auto; font-size:.85rem; font-weight:700; white-space:nowrap}
.opt.good .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)}
.opt:disabled{cursor:default}

.feedback{margin-top:1rem; border-radius:6px; padding:1rem 1.25rem; border:1px solid}
.feedback.ok{background:var(--ok-bg); border-color:var(--ok)}
.feedback.no{background:var(--bad-bg); border-color:var(--bad)}
.feedback h3{font-size:1.1rem}
.feedback.ok h3{color:var(--ok)} .feedback.no h3{color:var(--bad)}
.work{margin:.6rem 0 0; display:flex; flex-wrap:wrap; gap:.4rem 1.2rem; align-items:center}
.work .lbl{font-weight:600}
.work math{font-size:1.4rem; math-style:normal}

.actions{display:flex; gap:.7rem; flex-wrap:wrap; margin-top:1.1rem; align-items:center}
.btn{background:var(--pen); color:var(--surface); border:2px solid var(--pen); border-radius:6px; padding:.65rem 1.2rem; font-weight:700; min-height:2.9rem}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface); color:var(--pen)}
.btn:disabled{opacity:.45; cursor:not-allowed; filter:none}

/* navigator */
.nav{display:flex; flex-wrap:wrap; gap:.35rem; margin-top:1.1rem}
.nav button{width:2.4rem; height:2.4rem; border:1.5px solid var(--line); background:var(--surface); border-radius:4px; font-weight:600; font-size:.9rem}
.nav button.done{background:var(--pen-soft); border-color:var(--pen)}
.nav button.cur{outline:3px solid var(--pen); outline-offset:1px}
.confirm{margin-top:1rem; background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn); border-radius:6px; padding:1rem 1.25rem}
.confirm p{margin:0 0 .6rem; font-weight:600}

/* result */
.score{display:flex; align-items:baseline; gap:.8rem; flex-wrap:wrap; margin-top:.4rem}
.score .big{font-size:3rem; font-weight:800; letter-spacing:-.03em; color:var(--pen); line-height:1}
.score .pct{color:var(--muted); font-size:1.1rem}
.sections{list-style:none; padding:0; margin:1rem 0 0; display:grid; gap:.5rem}
.sections li{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.2rem .8rem; align-items:center}
.sections .bar{grid-column:1/-1; height:6px; background:var(--line); border-radius:3px; overflow:hidden}
.sections .bar span{display:block; height:100%; background:var(--pen)}
.sections .val{font-weight:700}
.review{list-style:none; padding:0; margin:1rem 0 0}
.review>li{border-top:1px solid var(--line); padding:.9rem 0}
.rv-head{display:flex; gap:.7rem; align-items:center; flex-wrap:wrap}
.rv-head math{font-size:1.4rem; math-style:normal}
.st{font-size:.85rem; font-weight:700; padding:.05rem .5rem; border-radius:4px; border:1px solid}
.st.g{color:var(--ok); border-color:var(--ok); background:var(--ok-bg)}
.st.f{color:var(--bad); border-color:var(--bad); background:var(--bad-bg)}
.st.n{color:var(--warn); border-color:var(--warn); background:var(--warn-bg)}
.rv-body{margin-top:.5rem; color:var(--muted)}
.rv-body math{font-size:1.25rem; math-style:normal; color:var(--ink)}
.rv-body div{margin:.25rem 0}
.rv-body b{color:var(--ink)}
footer{max-width:46rem; margin:0 auto; padding:0 1rem 2rem; color:var(--muted); font-size:.85rem}

.qtext{font-size:1.15rem; font-weight:600; line-height:1.45}
.qcard{align-items:flex-start; min-height:0}
.qcard math{font-size:1.2rem; math-style:normal}
.fig{background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:.5rem; margin-top:.6rem; color:var(--ink)}
.fig svg{margin:0 auto}
.opt{font-size:1.05rem; line-height:1.35}
.opt .txt{flex:1 1 auto; min-width:0}
.opt .tag{margin-left:.6rem}
.rv-q{font-weight:600}
</style>
</head>

,sans-serif;font-weight:normal;font-style:normal;stroke:var(--surface);stroke-width:1.3;paint-order:stroke;stroke-linejoin:round\">7 cm</text><text x=\"29.5\" y=\"36.0\" text-anchor=\"start\" dominant-baseline=\"central\" style=\"fill:var(--pen);font-size:4.2px;font-family:Arial,Helvetica,sans-serif;font-weight:normal;font-style:normal;stroke:var(--surface);stroke-width:1.3;paint-order:stroke;stroke-linejoin:round\">?</text></svg>", "opts": ["6 cm", "3 cm", "12 cm", "9 cm"], "uitleg": "Oppervlakte = $ {1/2}·(7+11)·h=9·h $. Dus $ 9·h=54 $ en $ h=6 $ cm."}]]};
const NAMEN = ['Oefentoets 1','Oefentoets 2','Oefentoets 3','Oefentoets 4','Eindtoets'];
const LETTERS = ['A','B','C','D'];

function parseMath(input){
  const s = input.replace(/\s+/g,''); let i = 0;
  function seq(stops){
    const atoms = [];
    while(i < s.length && !stops.includes(s[i])){
      const ch = s[i];
      if(ch === '{'){
        i++; const n = seq('/'); i++; const d = seq('}'); i++;
        atoms.push([`<mfrac><mrow>${n.join('')}</mrow><mrow>${d.join('')}</mrow></mfrac>`]);
      } else if(ch === '('){
        i++; const inner = seq(')'); i++;
        atoms.push(['<mo>(</mo>', ...inner, '<mo>)</mo>']);
      } else if(/[0-9]/.test(ch)){
        const m = s.slice(i).match(/^[0-9]+(?:,[0-9]+)?/);
        atoms.push([`<mn>${m[0]}</mn>`]); i += m[0].length;
      } else if(ch === '^'){
        i++; const base = atoms.pop(); let exp;
        if(s[i] === '{'){ i++; exp = seq('}'); i++; }
        else { const m = s.slice(i).match(/^-?[0-9]+|^[a-z]/); exp = [`<mn>${m[0]}</mn>`]; i += m[0].length; }
        atoms.push([`<msup><mrow>${base.join('')}</mrow><mrow>${exp.join('')}</mrow></msup>`]);
      } else if(ch === '-'){ atoms.push(['<mo>\u2212</mo>']); i++; }
      else if('+=\u00B7:'.includes(ch)){ atoms.push([`<mo>${ch}</mo>`]); i++; }
      else if(/[a-z]/i.test(ch)){ atoms.push([`<mi>${ch}</mi>`]); i++; }
      else { atoms.push([`<mo>${ch}</mo>`]); i++; }
    }
    return atoms.flat();
  }
  return seq('').join('');
}
const M = (str) => `<math display="inline">${parseMath(str)}</math>`;
const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* tekst met $wiskunde$ */
const T = (str) => str.split('$').map((p,i) => i % 2 ? M(p) : esc(p)).join('');

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
const $app = document.getElementById('app');
let S = null;

function startQuiz(idx){
  const mode = idx === 4 ? 'toets' : 'oefen';
  const items = D.toetsen[idx].map((it,n) => ({
    ...it, n, secIdx: D.sections.findIndex(s => s.nr === it.sec), order: shuffle([0,1,2,3]), choice: null
  }));
  S = {idx, mode, items, cur: 0, view: 'quiz', confirming: false};
  render(true);
}
const answered = () => S.items.filter(x => x.choice !== null).length;
const correct = (it) => it.choice === 0;

function renderMenu(){
  const rows = [0,1,2,3].map(i => `
    <li><button class="row" data-act="start" data-i="${i}">
      <span><b>${NAMEN[i]}</b><small>12 vragen. Na elke vraag zie je direct de uitwerking.</small></span>
      <span class="go">Start</span></button></li>`).join('');
  return `
    <h1 id="focus" tabindex="-1">Afstand en oppervlakte</h1>
    <p class="lede">Getal &amp; Ruimte 2 havo/vwo, hoofdstuk 2. Kies bij elke vraag het juiste antwoord.</p>
    <h2 class="group-title">Oefenen</h2>
    <ul class="rows">${rows}</ul>
    <h2 class="group-title">Eindtoets</h2>
    <ul class="rows exam-row"><li><button class="row" data-act="start" data-i="4">
      <span><b>${NAMEN[4]}</b><small>12 vragen. Je ziet pas na het inleveren je score en de uitwerkingen.</small></span>
      <span class="go">Start</span></button></li></ul>
    <p class="note">Elke toets bevat twee vragen per paragraaf (2.1 tot en met 2.6). De volgorde van de antwoorden verandert bij elke poging.</p>`;
}

function topbar(){
  const total = S.items.length, pos = S.cur + 1;
  return `
    <div class="topbar">
      <button class="link" data-act="menu">Terug naar menu</button>
      <span class="badge">${S.mode === 'toets' ? 'Eindtoets' : 'Oefenen'}</span>
    </div>
    <h1 style="font-size:1.5rem;margin-top:.6rem">${NAMEN[S.idx]}</h1>
    <div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="${total}" aria-valuenow="${pos}" aria-label="Voortgang"><span style="width:${(pos/total)*100}%"></span></div>`;
}

function renderQuiz(){
  const it = S.items[S.cur];
  const sec = D.sections[it.secIdx];
  const locked = S.mode === 'oefen' && it.choice !== null;
  const opts = it.order.map((oi,pos) => {
    let cls = 'opt', tag = '';
    if(locked){
      if(oi === 0){ cls += ' good'; tag = '<span class="tag">Juist antwoord</span>'; }
      else if(oi === it.choice){ cls += ' wrong'; tag = '<span class="tag">Jouw keuze</span>'; }
    } else if(it.choice === oi){ cls += ' sel'; tag = '<span class="tag">Gekozen</span>'; }
    return `<button class="${cls}" data-act="pick" data-o="${oi}" ${locked?'disabled':''} aria-pressed="${it.choice === oi}">
      <span class="l" aria-hidden="true">${LETTERS[pos]}</span><span class="sr">Antwoord ${LETTERS[pos]}: </span><span class="txt">${T(it.opts[oi])}</span>${tag}</button>`;
  }).join('');

  let feedback = '';
  if(locked){
    const ok = correct(it);
    feedback = `<div class="feedback ${ok?'ok':'no'}" role="status">
      <h3>${ok ? 'Goed gedaan.' : 'Niet juist.'}</h3>
      <p style="margin:.5rem 0 0"><b>Uitwerking.</b> ${T(it.uitleg)}</p>
      <p style="margin:.4rem 0 0"><b>Juist antwoord:</b> ${T(it.opts[0])}</p></div>`;
  }

  let actions = '', nav = '', confirm = '';
  const last = S.cur === S.items.length - 1;
  if(S.mode === 'oefen'){
    actions = `<div class="actions"><button class="btn" data-act="next" ${it.choice===null?'disabled':''}>${last?'Bekijk resultaat':'Volgende vraag'}</button></div>`;
  } else {
    nav = `<div class="nav" role="group" aria-label="Ga naar vraag">${S.items.map((x,n) =>
      `<button data-act="goto" data-n="${n}" class="${x.choice!==null?'done':''} ${n===S.cur?'cur':''}"
        aria-label="Vraag ${n+1}${x.choice!==null?', beantwoord':', nog niet beantwoord'}" ${n===S.cur?'aria-current="true"':''}>${n+1}</button>`).join('')}</div>`;
    actions = `<div class="actions">
      <button class="btn sec" data-act="prev" ${S.cur===0?'disabled':''}>Vorige</button>
      <button class="btn sec" data-act="next" ${last?'disabled':''}>Volgende</button>
      <button class="btn" data-act="submit">Inleveren</button>
      <span class="lede" style="margin:0">${answered()} van ${S.items.length} beantwoord</span></div>`;
    if(S.confirming){
      const open = S.items.length - answered();
      confirm = `<div class="confirm" role="alertdialog" aria-labelledby="cf">
        <p id="cf">Je hebt ${open} ${open===1?'vraag':'vragen'} niet beantwoord. Onbeantwoorde vragen tellen als fout.</p>
        <div class="actions" style="margin-top:0"><button class="btn" data-act="submit-final">Toch inleveren</button>
        <button class="btn sec" data-act="cancel">Verder werken</button></div></div>`;
    }
  }

  return `${topbar()}
    <p class="meta">Vraag ${S.cur+1} van ${S.items.length}. <b>${sec.nr} ${sec.titel}</b></p>
    <div class="qcard"><span class="qnum">${S.cur+1}.</span><div class="qtext">${T(it.tekst)}</div></div>
    ${it.svg ? `<div class="fig">${it.svg}</div>` : ''}
    <div class="opts" role="group" aria-label="Antwoordopties">${opts}</div>
    ${feedback}${actions}${nav}${confirm}`;
}

function renderResult(){
  const total = S.items.length;
  const score = S.items.filter(correct).length;
  const pct = Math.round(score/total*100);
  const secs = D.sections.map((sec,si) => {
    const sub = S.items.filter(x => x.secIdx === si);
    const g = sub.filter(correct).length;
    return `<li><span><b>${sec.nr}</b> ${sec.titel}</span><span class="val">${g} van ${sub.length}</span>
      <span class="bar" aria-hidden="true"><span style="width:${g/sub.length*100}%"></span></span></li>`;
  }).join('');
  const review = S.items.map(it => {
    const st = it.choice === null ? ['n','Niet beantwoord'] : correct(it) ? ['g','Goed'] : ['f','Fout'];
    const mine = it.choice === null ? '<i>geen antwoord gekozen</i>' : T(it.opts[it.choice]);
    return `<li><div class="rv-head"><b>${it.n+1}.</b><span class="st ${st[0]}">${st[1]}</span><span class="rv-q">${T(it.tekst)}</span></div>
      <div class="rv-body">
        ${correct(it) ? '' : `<div><b>Jouw antwoord:</b> ${mine}</div>`}
        <div><b>Juiste antwoord:</b> ${T(it.opts[0])}</div>
        <div><b>Uitwerking:</b> ${T(it.uitleg)}</div></div></li>`;
  }).join('');
  return `
    <div class="topbar"><button class="link" data-act="menu">Terug naar menu</button>
      <span class="badge">${S.mode === 'toets' ? 'Eindtoets' : 'Oefenen'}</span></div>
    <h1 id="focus" tabindex="-1" style="font-size:1.5rem;margin-top:.6rem">Resultaat ${NAMEN[S.idx]}</h1>
    <div class="sheet">
      <div class="score"><span class="big">${score} van ${total}</span><span class="pct">${pct}% goed</span></div>
      <h2 style="margin-top:1.4rem;font-size:1.1rem">Score per onderdeel</h2>
      <ul class="sections">${secs}</ul>
      <div class="actions"><button class="btn" data-act="retry">Opnieuw proberen</button>
        <button class="btn sec" data-act="menu">Kies een andere toets</button></div>
    </div>
    <div class="sheet"><h2 style="font-size:1.1rem">Alle vragen met uitwerking</h2><ul class="review">${review}</ul></div>`;
}

function render(focusTop){
  $app.innerHTML = !S ? renderMenu() : S.view === 'result' ? renderResult() : renderQuiz();
  if(focusTop){
    const f = document.getElementById('focus') || $app.querySelector('h1');
    if(f){ f.setAttribute('tabindex','-1'); f.focus({preventScroll:true}); }
    window.scrollTo({top:0});
  }
}

function pick(oi){
  const it = S.items[S.cur];
  if(S.mode === 'oefen' && it.choice !== null) return;
  it.choice = oi; S.confirming = false; render();
  if(S.mode === 'oefen'){ const fb = $app.querySelector('.feedback'); if(fb) fb.scrollIntoView({block:'nearest'}); }
}
function finish(){ S.view = 'result'; S.confirming = false; render(true); }
function go(n){ S.cur = n; S.confirming = false; render(true); }

$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const a = b.dataset.act;
  if(a === 'start') startQuiz(+b.dataset.i);
  else if(a === 'menu'){ S = null; render(true); }
  else if(a === 'pick') pick(+b.dataset.o);
  else if(a === 'next'){
    if(S.mode === 'oefen' && S.cur === S.items.length-1) finish();
    else if(S.cur < S.items.length-1) go(S.cur+1);
  }
  else if(a === 'prev'){ if(S.cur > 0) go(S.cur-1); }
  else if(a === 'goto') go(+b.dataset.n);
  else if(a === 'submit'){
    if(answered() < S.items.length){ S.confirming = true; render(); const c = $app.querySelector('.confirm'); if(c) c.scrollIntoView({block:'nearest'}); }
    else finish();
  }
  else if(a === 'submit-final') finish();
  else if(a === 'cancel'){ S.confirming = false; render(); }
  else if(a === 'retry') startQuiz(S.idx);
});

document.addEventListener('keydown', e => {
  if(!S || S.view !== 'quiz' || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase(); const it = S.items[S.cur];
  const p = 'abcd'.indexOf(k) >= 0 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);
  if(k.length === 1 && p >= 0 && p < 4){ pick(it.order[p]); }
  else if(S.mode === 'toets' && k === 'arrowright' && S.cur < S.items.length-1) go(S.cur+1);
  else if(S.mode === 'toets' && k === 'arrowleft' && S.cur > 0) go(S.cur-1);
});

render(false);
</script>
</body>
</html>
